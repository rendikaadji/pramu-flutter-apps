name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      # Tes API live (test/api_contract_live*) otomatis dilewati tanpa backend; kontraknya dijalankan terpisah.
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info

  # Kontrak Flutter <-> Laravel: menjalankan tes live terhadap backend asli (seed segar).
  # Butuh secret BACKEND_REPO_TOKEN (PAT dengan akses baca ke repo backend privat).
  contract:
    # Secret tidak tersedia di PR dari fork/Dependabot; tanpa guard checkout backend gagal dan check jadi merah.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Versi mengikuti Docs/10 §1.1 di repo backend. Skema backend memakai fitur khusus PostgreSQL.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pramu
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: ci
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: pramu
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      OTP_FIXED_CODE: '123456'
    steps:
      - uses: actions/checkout@v7
      # Perubahan kontrak dikerjakan di dua repo: pakai branch backend bernama sama selama branch itu masih punya
      # commit yang belum ada di main. Branch yang sudah di-merge (ahead_by = 0) atau tidak ada memakai main.
      - name: Pilih ref backend
        id: backend_ref
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ secrets.BACKEND_REPO_TOKEN }}
        run: |
          ahead=$(gh api "repos/rendikaadji/pramu-laravel-web/compare/main...${BRANCH}" --jq .ahead_by 2>/dev/null) || ahead=0
          if [ "${ahead:-0}" -gt 0 ] 2>/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
          echo "Backend: $(cat "$GITHUB_OUTPUT" | tail -1) (ahead_by=${ahead:-0})"
      - uses: actions/checkout@v7
        with:
          repository: rendikaadji/pramu-laravel-web
          ref: ${{ steps.backend_ref.outputs.ref }}
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: backend
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql
          coverage: none
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Siapkan backend
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan migrate:fresh --seed --force
          (cd public && nohup php -S 127.0.0.1:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php > ../serve.log 2>&1 &)
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8000/up >/dev/null && break; sleep 1; done
      - run: flutter pub get
      # Berurutan (-j 1): berkas kontrak live menulis ke DB yang sama.
      - run: |
          flutter test -j 1 test/api_contract_live_test.dart \
            --dart-define=LIVE_API=true --dart-define=API_BASE_URL=http://127.0.0.1:8000/api/v1
      - if: failure()
        run: cat backend/serve.log backend/storage/logs/*.log 2>/dev/null | tail -100
